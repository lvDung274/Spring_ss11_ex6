spring.application.name=patient

# Cấu hình kết nối đến database
spring.datasource.url=jdbc:postgresql://localhost:5432/db_patient
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# Cấu hình JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

#Cấu hình log
logging.file.name=loggings/logging.log
logging.file.path=loggings
# Hiển thị requestId nằm trong ngoặc vuông ngay sau thời gian và thread
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{requestId}] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{requestId}] %-5level %logger{36} - %msg%n
logging.pattern.level=%5p

#Thong số giới hnaj dung lượng của một file
logging.logback.rollingpolicy.max-file-size=2MB
#Giới hạn thời gian lưu trữ file log tối đa 7 ngày
logging.logback.rollingpolicy.max-history=7

#Chuyen doi cau hinh sang moi truoing prod
spring.profiles.active=prod

# Log của toàn bộ ứng dụng ở mức INFO
logging.level.root=INFO

# Log của Hibernate/JPA ở mức DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Log của package service ở mức TRACE ()
logging.level.com.example.patient.services=TRACE